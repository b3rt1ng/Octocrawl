name: Publish to PyPI

on:
  push:
    branches: [main]
    # OctoCrawl's version is dynamic: hatchling reads it from version.txt (see
    # [tool.hatch.version] in pyproject.toml), so that is the file to watch here.
    # pyproject.toml is watched too, in case the packaging itself changes.
    paths:
      - "src/octocrawl/version.txt"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade hatch

      - name: Check if version is new on PyPI
        id: check
        run: |
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          # the version is dynamic, so ask hatch for it rather than reading
          # pyproject: this can then never drift from what the build produces
          ver=$(hatch version)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/$name/$ver/json" > /dev/null; then
            echo "$name $ver already on PyPI, skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $name $ver"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade build
      - run: python -m build

      - name: Confirm the artifact carries the version we checked
        run: |
          expected="${{ needs.check.outputs.version }}"
          built=$(basename "$(ls dist/*.whl)" | cut -d- -f2)
          if [ "$built" != "$expected" ]; then
            echo "built $built but checked $expected, refusing to publish" >&2
            exit 1
          fi
          echo "artifact version $built confirmed"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [check, build]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing only. No contents:write: GitHub releases are cut by
      # hand, so nothing here needs to write to the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
